<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL OVERDRIVE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="arcadebigbox">

  <div class="arcadeheader">
    <div class="arcadetitle">PIXEL OVERDRIVE</div>
    <div class="arcadesubtitle">A RETRO GAMING EXPERIENCE</div>
  </div>

  <div class="arcadecontent">

    <div class="arcadeleft">

      <div class="arcadeimage">
        <div class="arcadeframe arcadeframe-blue"></div>
        <div class="arcadeframe arcadeframe-purple"></div>

        <!-- KARAKTERKÉP -->
        <img src="https://i.pinimg.com/736x/1d/14/0a/1d140aa9dde0981d1161ce338d0c556b.jpg">
      </div>

      <div class="highscore">
        <div class="highscoretitle">HIGH SCORE</div>

        <!-- PONTSZÁM -->
        <div class="highscorenumber" data-score="487">487</div>

        <div class="highscorelabel">WORDS</div>
      </div>

    </div>

    <div class="arcadedialogue">

      <!-- IDÉZET 1 -->
      <div class="arcadequote">
        IDE JÖN AZ ELSŐ IDÉZET
      </div>

      <div class="arcadedialoguecontent">
      <!-- REAG SZÖVEGE -->
      IDE JÖN A REAG SZÖVEGE
      </div>

      <!-- IDÉZET 2 -->
      <div class="arcadequote">
        IDE JÖN A MÁSODIK IDÉZET
      </div>

    </div>

  </div>

  <div class="arcadefooter">

    <div class="arcadeinfo1">
      <div class="arcadeinfolabel">
        <span class="arcadecoin"></span>
        LEVEL
      </div>

      <!-- LEVEL SZÁMA -->
      <div class="arcadeinfovalue">08</div>
    </div>

    <div class="arcadeinfo2">
      <div class="arcadeinfolabel">
        <span class="arcadehearts">
          <span class="arcadeheart"></span>
          <span class="arcadeheart half"></span>
        </span>
        PLAYERS
      </div>

      <!-- JÁTÉKOSNEVEK -->
      <div class="arcadeinfovalue">Player 1 x Player 2</div>
    </div>

    <div class="arcadeinfo arcadestart">
      <span class="arcadeplay"></span>
      <span class="arcadestarttext">PRESS START</span>
    </div>

  </div>

</div>

</body>
</html>
